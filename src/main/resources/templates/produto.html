<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Controle de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container my-5" style="max-width: 700px;">

    
    <div class="text-center mb-4">
        <h1 class="h3 fw-bold text-primary">📦 Gerenciamento de Produtos</h1>
        <p class="text-muted">Cadastre e consulte os produtos disponíveis no sistema</p>
    </div>

   
    <div class="card shadow-sm mb-4 border-0">
        <div class="card-header bg-primary text-white fw-semibold">
            Adicionar Novo Produto
        </div>
        <div class="card-body p-4">
            <form method="POST" th:action="@{/salvarProduto}" th:object="${produto}">
                <div class="mb-3">
                    <label for="descricao" class="form-label fw-medium">Nome / Descrição:</label>
                    <input type="text" id="descricao" class="form-control" th:field="*{descricao}" placeholder="Ex: Caderno 10 Matérias" required>
                </div>
                <div class="mb-3">
                    <label for="preco" class="form-label fw-medium">Preço (R$):</label>
                    <input type="number" step="0.01" id="preco" class="form-control" th:field="*{preco}" placeholder="0.00" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success fw-semibold">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    
    <div class="card shadow-sm border-0">
        <div class="card-header bg-secondary text-white fw-semibold">
            Produtos Cadastrados
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">Código</th>
                        <th scope="col">Descrição</th>
                        <th scope="col" class="pe-3">Preço</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="produto: ${lista}">
                        <td class="ps-3 fw-bold text-secondary" th:text="${produto.codigo}"></td>
                        <td th:text="${produto.descricao}"></td>
                        <td class="pe-3 text-success fw-semibold" th:text="'R$ ' + ${produto.preco}"></td>
                    </tr>
                    
                    <tr th:if="${#lists.isEmpty(lista)}">
                        <td colspan="3" class="text-center py-4 text-muted">Nenhum produto cadastrado ainda.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
